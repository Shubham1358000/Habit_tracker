<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Habit Tracker</title>
    <link rel="stylesheet" href="Habit_tracker.css">
    <script src="Habit_tracker.js" defer></script>
</head>
<body>

<div class="container">
    <h1>Smart Habit Tracker</h1>

    <!-- Add New Habit -->
    <label for="habitInput">New Habit:</label>
    <input type="text" id="habitInput" placeholder="e.g. Drink Water" required>

    <button id="addHabitBtn">Add Habit</button>

    <h2>Your Habits</h2>
    <ul id="habitList"></ul>
</div>

</body>
</html>
